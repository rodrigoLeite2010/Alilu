services:
  postgres:
    image: postgres:16-alpine
    container_name: alilu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alilu
      POSTGRES_USER: alilu
      POSTGRES_PASSWORD: alilu
    ports:
      # Host:Container — 5433 no host para não brigar com outro Postgres
      # (ex. de outro projeto) que já esteja usando a porta 5432 padrão.
      # Dentro do container continua sendo a porta 5432 normal do Postgres.
      - "5433:5432"
    volumes:
      - alilu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Etapa 15 — permite `docker compose up` (e qualquer orquestrador)
      # saber quando o Postgres já está pronto para aceitar conexões, não
      # só quando o container "subiu". `pg_isready` vem embutido na própria
      # imagem postgres:16-alpine, nenhuma ferramenta extra necessária.
      test: ["CMD-SHELL", "pg_isready -U alilu -d alilu"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  alilu_postgres_data:
